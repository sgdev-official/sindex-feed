<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S-Indexer Network Feed</title>
<meta name="description" content="A live dashboard of the latest items added to the S-Indexer network feed.">
<meta name="robots" content="index, follow">
<style>
  :root{
    --bg-canvas:#0d1117;
    --bg-surface:#161b22;
    --bg-surface-hover:#1c2129;
    --border-default:#30363d;
    --text-primary:#e6edf3;
    --text-muted:#8b949e;
    --accent:#2f81f7;
    --success:#3fb950;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg-canvas);
    color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
  }
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 1.25rem;}

  header{
    border-bottom:1px solid var(--border-default);
    padding:3rem 0 2.25rem;
    background:radial-gradient(circle at 15% 0%, rgba(47,129,247,.08), transparent 45%), var(--bg-canvas);
  }
  header h1{font-size:clamp(1.75rem,3vw,2.5rem);letter-spacing:-.02em;margin-bottom:.4rem;}
  header p{color:var(--text-muted);}

  main{padding:2.5rem 0 4rem;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:.85rem;
  }

  .card{
    background:var(--bg-surface);
    border:1px solid var(--border-default);
    border-radius:8px;
    padding:1.1rem 1.25rem;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .card:hover{border-color:#3d444d;background:var(--bg-surface-hover);}

  .card a{
    display:block;
    font-weight:600;
    font-size:.98rem;
    word-break:break-word;
    margin-bottom:.5rem;
  }
  .meta{color:var(--text-muted);font-size:.82rem;}

  .badge{
    display:inline-block;
    margin-top:.75rem;
    font-size:.72rem;
    font-weight:600;
    padding:.28rem .6rem;
    border-radius:999px;
    border:1px solid rgba(63,185,80,.3);
    color:var(--success);
    background:rgba(63,185,80,.12);
    width:fit-content;
  }

  .state-panel{
    border:1px dashed var(--border-default);
    border-radius:8px;
    padding:3rem 1.5rem;
    text-align:center;
    color:var(--text-muted);
  }
  .hidden{display:none;}

  .spinner{
    width:28px;height:28px;
    border:3px solid var(--border-default);
    border-top-color:var(--accent);
    border-radius:50%;
    margin:0 auto 1rem;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .retry-btn{
    background:transparent;
    border:1px solid var(--border-default);
    color:var(--text-primary);
    padding:.45rem 1rem;
    border-radius:6px;
    cursor:pointer;
    font-size:.85rem;
  }
  .retry-btn:hover{border-color:var(--accent);color:var(--accent);}

  footer{
    border-top:1px solid var(--border-default);
    color:var(--text-muted);
    font-size:.85rem;
    padding:2rem 0;
  }

  @media (prefers-reduced-motion:reduce){
    .card{transition:none;}
    .spinner{animation:none;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>S-Indexer Network Feed</h1>
    <p>Live view of the latest items added to your network feed.</p>
  </div>
</header>

<main class="wrap">
  <section aria-labelledby="feed-heading">
    <h2 id="feed-heading" class="hidden">Latest feed items</h2>

    <div id="loading-state" class="state-panel">
      <div class="spinner"></div>
      <div>Loading the latest feed items…</div>
    </div>

    <div id="error-state" class="state-panel hidden">
      <div style="margin-bottom:.75rem;">We couldn't load the feed right now.</div>
      <button id="retry-btn" class="retry-btn">Retry</button>
    </div>

    <div id="feed-container" class="grid" role="list"></div>
  </section>
</main>

<footer>
  <div class="wrap">&copy; <span id="year"></span> S-Indexer Network.</div>
</footer>

<script>
  // Deployed Google Apps Script Web App endpoint.
  const GOOGLE_SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbzG1fAg6CKkbsOLaNgGRsuqvYoyg8tva6VwPQusEfzsISyJXmVchP_72Vjj9_jY3zATEQ/exec";

  const MAX_ITEMS = 30;

  const feedContainer = document.getElementById("feed-container");
  const loadingState = document.getElementById("loading-state");
  const errorState = document.getElementById("error-state");
  const retryBtn = document.getElementById("retry-btn");

  document.getElementById("year").textContent = new Date().getFullYear();

  // Escape untrusted feed data before inserting into the DOM.
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  function formatTimestamp(raw) {
    if (!raw) return "Unknown date";
    const date = new Date(raw);
    if (isNaN(date.getTime())) return escapeHtml(String(raw));
    return date.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function renderFeed(items) {
    feedContainer.innerHTML = "";

    if (!items.length) {
      feedContainer.innerHTML = `<div class="state-panel">No items yet.</div>`;
      return;
    }

    const sorted = [...items].reverse().slice(0, MAX_ITEMS);

    sorted.forEach(item => {
      const url = item.url || "";
      const safeUrl = escapeHtml(url) || "#";
      const displayUrl = url ? escapeHtml(url) : "No URL provided";

      const card = document.createElement("div");
      card.className = "card";
      card.setAttribute("role", "listitem");
      card.innerHTML = `
        <div>
          <a href="${safeUrl}" target="_blank" rel="dofollow index follow">🔗 ${displayUrl}</a>
          <div class="meta">Dispatched: ${formatTimestamp(item.timestamp)}</div>
        </div>
        <span class="badge">Queued</span>
      `;
      feedContainer.appendChild(card);
    });
  }

  async function loadFeed() {
    loadingState.classList.remove("hidden");
    errorState.classList.add("hidden");
    feedContainer.innerHTML = "";

    try {
      const response = await fetch(GOOGLE_SHEETS_API_URL);
      if (!response.ok) throw new Error(`Request failed: ${response.status}`);
      const data = await response.json();
      loadingState.classList.add("hidden");
      renderFeed(Array.isArray(data) ? data : (data.items || []));
    } catch (err) {
      console.error("Failed to load feed:", err);
      loadingState.classList.add("hidden");
      errorState.classList.remove("hidden");
    }
  }

  retryBtn.addEventListener("click", loadFeed);
  document.addEventListener("DOMContentLoaded", loadFeed);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================================
       CHARSET / VIEWPORT
  ============================================================ -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ============================================================
       TITLE & SEO META
  ============================================================ -->
  <title>S-Indexer Network Feed</title>
  <meta name="description" content="A live dashboard of the latest items added to the S-Indexer network feed.">
  <meta name="robots" content="index, follow">

  <!-- ============================================================
       BOOTSTRAP 5 (CDN)
  ============================================================ -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ============================================================
       DARK THEME (GitHub / Vercel inspired)
  ============================================================ -->
  <style>
    :root {
      --bg-canvas: #0d1117;
      --bg-surface: #161b22;
      --bg-surface-hover: #1c2129;
      --border-default: #30363d;
      --text-primary: #e6edf3;
      --text-muted: #8b949e;
      --accent: #2f81f7;
      --success: #3fb950;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Header */
    .app-header {
      border-bottom: 1px solid var(--border-default);
      padding: 3rem 0 2.25rem;
      background:
        radial-gradient(circle at 15% 0%, rgba(47,129,247,0.08), transparent 45%),
        var(--bg-canvas);
    }
    .app-header h1 {
      font-weight: 700;
      font-size: clamp(1.75rem, 3vw, 2.5rem);
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }
    .app-header p {
      color: var(--text-muted);
      margin-bottom: 0;
    }

    /* Feed grid */
    .feed-section { padding: 2.5rem 0 4rem; }

    .feed-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
      height: 100%;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .feed-card:hover {
      border-color: #3d444d;
      background-color: var(--bg-surface-hover);
    }

    .feed-link {
      font-weight: 600;
      font-size: 0.98rem;
      word-break: break-word;
      display: block;
      margin-bottom: 0.5rem;
    }

    .feed-meta {
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .status-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.28rem 0.6rem;
      border-radius: 999px;
      border: 1px solid rgba(63, 185, 80, 0.3);
      color: var(--success);
      background-color: rgba(63, 185, 80, 0.12);
      white-space: nowrap;
    }

    /* Loading / error states */
    .state-panel {
      border: 1px dashed var(--border-default);
      border-radius: 8px;
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
    }

    footer {
      border-top: 1px solid var(--border-default);
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 2rem 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .feed-card { transition: none; }
    }
  </style>
</head>

<body>

  <!-- ============================================================
       HEADER
  ============================================================ -->
  <header class="app-header">
    <div class="container">
      <h1>S-Indexer Network Feed</h1>
      <p>Live view of the latest items added to your network feed.</p>
    </div>
  </header>

  <!-- ============================================================
       MAIN CONTENT
  ============================================================ -->
  <main class="container feed-section">
    <section aria-labelledby="feed-heading">
      <h2 id="feed-heading" class="visually-hidden">Latest feed items</h2>

      <!-- Loading state -->
      <div id="loading-state" class="state-panel">
        <div class="spinner-border text-light mb-3" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
        <div>Loading the latest feed items…</div>
      </div>

      <!-- Error state (hidden by default) -->
      <div id="error-state" class="state-panel d-none">
        <div class="mb-2">We couldn't load the feed right now.</div>
        <button id="retry-btn" class="btn btn-outline-light btn-sm">Retry</button>
      </div>

      <!-- Rendered feed cards go here -->
      <div id="feed-container" class="row g-3" role="list"></div>
    </section>
  </main>

  <!-- ============================================================
       FOOTER
  ============================================================ -->
  <footer>
    <div class="container">
      &copy; <span id="year"></span> S-Indexer Network.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ============================================================
       APP LOGIC
       Fetches feed items from your own Google Apps Script Web App
       JSON API and renders them as cards.
       Expected JSON shape (array of objects):
       [{ "timestamp": "2026-09-06", "url": "https://example.com" }, ...]
  ============================================================ -->
  <script>
    // Replace with your deployed Google Apps Script Web App URL.
    const GOOGLE_SHEETS_API_URL = "YOUR_APPS_SCRIPT_WEBAPP_URL";

    const MAX_ITEMS = 30;

    const feedContainer = document.getElementById("feed-container");
    const loadingState = document.getElementById("loading-state");
    const errorState = document.getElementById("error-state");
    const retryBtn = document.getElementById("retry-btn");

    document.getElementById("year").textContent = new Date().getFullYear();

    // Basic escaping to prevent XSS from untrusted feed data.
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function formatTimestamp(rawTimestamp) {
      if (!rawTimestamp) return "Unknown date";
      const date = new Date(rawTimestamp);
      if (isNaN(date.getTime())) return escapeHtml(String(rawTimestamp));
      return date.toLocaleString(undefined, {
        year: "numeric", month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    }

    function renderFeed(items) {
      feedContainer.innerHTML = "";

      if (!items.length) {
        feedContainer.innerHTML = `<div class="col-12"><div class="state-panel">No items yet.</div></div>`;
        return;
      }

      // Newest first, capped at MAX_ITEMS.
      const sorted = [...items].reverse().slice(0, MAX_ITEMS);

      sorted.forEach(item => {
        const url = item.url || "";
        const safeUrl = escapeHtml(url) || "#";
        const displayUrl = url ? escapeHtml(url) : "No URL provided";

        const col = document.createElement("div");
        col.className = "col-12 col-md-6 col-lg-4";
        col.setAttribute("role", "listitem");

        col.innerHTML = `
          <div class="feed-card d-flex flex-column justify-content-between">
            <div>
              <a class="feed-link" href="${safeUrl}" target="_blank" rel="noopener">
                🔗 ${displayUrl}
              </a>
              <div class="feed-meta">Added: ${formatTimestamp(item.timestamp)}</div>
            </div>
            <div class="mt-3">
              <span class="status-badge">Active</span>
            </div>
          </div>
        `;

        feedContainer.appendChild(col);
      });
    }

    async function loadFeed() {
      loadingState.classList.remove("d-none");
      errorState.classList.add("d-none");
      feedContainer.innerHTML = "";

      try {
        const response = await fetch(GOOGLE_SHEETS_API_URL);
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);

        const data = await response.json();
        loadingState.classList.add("d-none");
        renderFeed(Array.isArray(data) ? data : (data.items || []));
      } catch (err) {
        console.error("Failed to load feed:", err);
        loadingState.classList.add("d-none");
        errorState.classList.remove("d-none");
      }
    }

    retryBtn.addEventListener("click", loadFeed);

    document.addEventListener("DOMContentLoaded", loadFeed);
  </script>
</body>
</html>

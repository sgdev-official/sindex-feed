<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="6YaAi4Kb5HBAYj9lBmUXSq0bu78EUs2J90iOlof5yok" />
  <meta name="msvalidate.01" content="3D2484748725A52BC95CAB3C2187882D" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S-Indexer Network Feed</title>
  <meta name="description" content="Live URL feed for S-Indexer network nodes.">
  <meta name="robots" content="index, follow">
  <style>
    /* Ultra-Fast Black & Green Minimal Theme */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #00ff66; font-family: monospace; padding: 1rem; line-height: 1.4; }
    .wrap { max-width: 900px; margin: 0 auto; }
    header { border-bottom: 1px solid #003311; padding-bottom: 0.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
    p { color: #009933; font-size: 0.8rem; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0.5rem; }
    .card { background: #050505; border: 1px solid #003311; padding: 0.6rem; word-break: break-all; }
    .card a { color: #00ff66; text-decoration: none; font-weight: bold; display: block; margin-bottom: 0.2rem; }
    .card a:hover { text-decoration: underline; }
    .meta { color: #008822; font-size: 0.7rem; }
    
    .state { text-align: center; color: #008822; padding: 2rem 0; font-size: 0.9rem; }
    .btn { background: #002200; color: #00ff66; border: 1px solid #005511; padding: 0.4rem 0.8rem; cursor: pointer; font-family: monospace; }
    .btn:hover { background: #004400; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>S-Indexer Network Feed</h1>
    <p>> Live Node URL Stream</p>
  </header>

  <main>
    <div id="loading-state" class="state">> Connecting to Vercel KV...</div>
    <div id="error-state" class="state hidden">
      <p>[!] Failed to load feed stream.</p>
      <button type="button" class="btn" id="retry-btn" style="margin-top:0.5rem;">[ Retry ]</button>
    </div>
    <div id="feed-container" class="grid"></div>
  </main>
</div>

<script>
  // 🎯 Direct Render Backend Endpoint (/v1 ছাড়া)
  const API_FEED_URL = "https://s-indexing-tool-bakend.onrender.com/feed";

  const feedContainer = document.getElementById("feed-container");
  const loadingState = document.getElementById("loading-state");
  const errorState = document.getElementById("error-state");
  const retryBtn = document.getElementById("retry-btn");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function renderFeed(urls) {
    feedContainer.innerHTML = "";
    if (!urls || !urls.length) {
      feedContainer.innerHTML = `<div class="state">> No URLs queued in KV.</div>`;
      return;
    }

    urls.forEach(rawUrl => {
      const safeUrl = escapeHtml(rawUrl);
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <a href="${safeUrl}" target="_blank" rel="dofollow index follow">> ${safeUrl}</a>
        <div class="meta">Status: Queued</div>
      `;
      feedContainer.appendChild(card);
    });
  }

  async function loadFeed() {
    loadingState.classList.remove("hidden");
    errorState.classList.add("hidden");
    feedContainer.innerHTML = "";

    try {
      const res = await fetch(API_FEED_URL);
      if (!res.ok) throw new Error("Network error");
      const data = await res.json();
      
      loadingState.classList.add("hidden");
      renderFeed(data.urls || []);
    } catch (err) {
      console.error("Feed error:", err);
      loadingState.classList.add("hidden");
      errorState.classList.remove("hidden");
    }
  }

  retryBtn.addEventListener("click", loadFeed);
  document.addEventListener("DOMContentLoaded", loadFeed);
</script>
</body>
</html>
